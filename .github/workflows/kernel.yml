# Build the MSL kernel whenever its inputs change. publish.sh publishes the
# artifact (named after tag.sh's tag); CI never publishes.
name: Kernel
on:
  push:
    branches: [main]
    paths: ["base.config", "msl.fragment", "build-linux.sh", "build.sh", "tag.sh", ".github/workflows/kernel.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  kernel:
    name: Kernel
    runs-on: ubuntu-24.04-arm
    # The same image as build.sh: the kernel config depends on the toolchain
    # (GCC version, whether rustc exists), not only on our inputs.
    container: docker.io/library/debian:trixie
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update -qq && apt-get install -y -qq build-essential flex bison bc libelf-dev libssl-dev curl xz-utils cpio kmod python3
      - name: Build
        run: |
          VER=$(sed -n 's/^VER=${KVER:-\(.*\)}$/\1/p' build.sh)
          ./build-linux.sh . out "$VER"
          echo "commit ${{ github.sha }}" > out/build-info.txt
          echo "TAG=$(cat out/tag)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TAG }}
          path: |
            out/Image
            out/config
            out/tag
            out/build-info.txt
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning *.sh
