# Build on changes; a manual run creates a SemVer GitHub release.
name: Kernel
on:
  push:
    branches: [main]
    paths: ["configs/**", "scripts/build-linux.sh", "scripts/build.sh", "scripts/next-version.sh", ".github/workflows/kernel.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  kernel:
    name: Build kernel
    runs-on: ubuntu-24.04-arm
    container: docker.io/library/debian:trixie
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: apt-get update -qq && apt-get install -y -qq git build-essential flex bison bc libelf-dev libssl-dev curl xz-utils cpio kmod python3
      - name: Determine release version
        id: release-version
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          BASE_VERSION=$(sed -n 's/^VER=${KVER:-\(.*\)}$/\1/p' scripts/build.sh)
          VERSION=$(./scripts/next-version.sh "$BASE_VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          VER=$(sed -n 's/^VER=${KVER:-\(.*\)}$/\1/p' scripts/build.sh)
          ./scripts/build-linux.sh . out "$VER" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: kernel-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/Image
            out/config
            out/kernel.version
            out/build-info.txt
          if-no-files-found: error

  release:
    name: Publish kernel release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: kernel
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: kernel-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
      - name: Validate version and build
        env:
          VERSION: ${{ needs.kernel.outputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be SemVer in MAJOR.MINOR.PATCH form" >&2
            exit 1
          fi
          SHORT_SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          TAG="v$VERSION+$SHORT_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          [ "$(cat out/build-info.txt)" = "commit $GITHUB_SHA" ]
          LINUX=$(sed -n 's/^# Linux\/arm64 \([^ ]*\) Kernel Configuration/\1/p' out/config)
          [ -n "$LINUX" ]
          (cd out && shasum -a 256 Image config kernel.version) > out/release.sha256
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "LINUX=$LINUX" >> "$GITHUB_ENV"
      - name: Download and verify Linux source
        run: |
          URL="https://cdn.kernel.org/pub/linux/kernel/v${LINUX%%.*}.x"
          mkdir -p dist
          curl -fsSL -o "dist/linux-$LINUX.tar.xz" "$URL/linux-$LINUX.tar.xz"
          curl -fsSL -o dist/sha256sums.asc "$URL/sha256sums.asc"
          WANT=$(awk -v f="linux-$LINUX.tar.xz" '$2==f {print $1}' dist/sha256sums.asc)
          [ -n "$WANT" ]
          [ "$(shasum -a 256 "dist/linux-$LINUX.tar.xz" | cut -d' ' -f1)" = "$WANT" ]
      - name: Create SemVer tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            out/Image out/config out/kernel.version out/build-info.txt out/release.sha256 "dist/linux-$LINUX.tar.xz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning scripts/*.sh
